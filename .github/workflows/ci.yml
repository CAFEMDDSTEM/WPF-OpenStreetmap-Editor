name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WPF-OpenStreetmap-Editor.slnx

      - name: Build
        run: dotnet build WPF-OpenStreetmap-Editor.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WPF-OpenStreetmap-Editor.slnx --configuration Release --no-build --logger trx --results-directory TestResults
